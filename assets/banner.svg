<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- waveform / signal motif on the right -->
  <g transform="translate(920,60)" opacity="0.9">
    <g stroke="url(#accent)" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="0"  y1="90" x2="0"  y2="120"/>
      <line x1="24" y1="60" x2="24" y2="150"/>
      <line x1="48" y1="30" x2="48" y2="180"/>
      <line x1="72" y1="70" x2="72" y2="140"/>
      <line x1="96" y1="10" x2="96" y2="200"/>
      <line x1="120" y1="50" x2="120" y2="160"/>
      <line x1="144" y1="85" x2="144" y2="125"/>
      <line x1="168" y1="35" x2="168" y2="175"/>
      <line x1="192" y1="65" x2="192" y2="145"/>
      <line x1="216" y1="95" x2="216" y2="115"/>
      <line x1="240" y1="45" x2="240" y2="165"/>
      <line x1="264" y1="75" x2="264" y2="135"/>
      <line x1="288" y1="20" x2="288" y2="190"/>
    </g>
  </g>

  <!-- play badge -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#161d27" stroke="url(#accent)" stroke-width="2"/>
    <path d="M40 32 L72 50 L40 68 Z" fill="url(#accent)"/>
  </g>

  <text x="210" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#f4f6f8">Reelforge</text>
  <text x="212" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#9aa7b4">News in. Finished, narrated video out. Fully automatic.</text>

  <g transform="translate(212,225)" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#c9d3dc">
    <g>
      <rect x="0" y="-16" width="118" height="26" rx="13" fill="#1b2430"/>
      <text x="14" y="2">Cloudflare Workers</text>
    </g>
    <g transform="translate(130,0)">
      <rect x="0" y="-16" width="76" height="26" rx="13" fill="#1b2430"/>
      <text x="14" y="2">Claude</text>
    </g>
    <g transform="translate(218,0)">
      <rect x="0" y="-16" width="104" height="26" rx="13" fill="#1b2430"/>
      <text x="14" y="2">ElevenLabs</text>
    </g>
    <g transform="translate(334,0)">
      <rect x="0" y="-16" width="96" height="26" rx="13" fill="#1b2430"/>
      <text x="14" y="2">FFmpeg</text>
    </g>
    <g transform="translate(442,0)">
      <rect x="0" y="-16" width="146" height="26" rx="13" fill="#1b2430"/>
      <text x="14" y="2">GitHub Actions</text>
    </g>
    <g transform="translate(600,0)">
      <rect x="0" y="-16" width="96" height="26" rx="13" fill="#1b2430"/>
      <text x="14" y="2">YouTube</text>
    </g>
  </g>
</svg>
